<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>inscription</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../assets/style/style.css" />
  </head>
  <body>
    <nav class="nav nav-pills nav-fill">
      <a class="nav-link" href="./index.html">Accueil</a>
      <a class="nav-link" href="./jeux.html">Jeux</a>
      <a class="nav-link" href="./compte.html">Compte</a>
      <a class="nav-link" href="./connexion.html">Connexion</a>
      <a class="nav-link active" aria-current="page" href="./inscription.html"
        >Inscription</a
      >
    </nav>
    <section>
      <fieldset>
        <form>
          <div class="mb-3">
            <label for="pseudo" class="form-label">Entrez votre pseudo</label>
            <input
              type="text"
              class="form-control"
              id="pseudo"
              aria-describedby="userNameHelp"
              autofocus
            />
            <div id="userNameHelp" class="form-text">Votre pseudo</div>

            <label for="email" class="form-label">Email address</label>
            <input
              type="email"
              class="form-control"
              id="email"
              aria-describedby="emailHelp"
            />
            <div id="emailHelp" class="form-text">
              L'Email ne sera pas partagé avec des tiers
            </div>
          </div>

          <div class="mb-3">
            <label for="exampleInputPassword1" class="form-label"
              >Mot de passe
            </label>

            <input type="password" class="form-control" id="InputPassword" />
            <div id="pwHelp" class="form-text">
              Au moins un symbole, un chiffre, et une lettre en majuscule.
            </div>
          </div>

          <button type="submit" class="btn btn-primary">Soumettre</button>
        </form>
      </fieldset>
    </section>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
